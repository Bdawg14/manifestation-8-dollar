<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8$ Manifestation</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: monospace;
    text-align: center;
  }

  .glass {
    width: 260px;
    height: 260px;
    border-radius: 24px;
    border: 2px solid rgba(0,255,255,0.4);
    background: rgba(0,255,255,0.05);
    box-shadow: 0 0 60px rgba(0,255,255,0.2), inset 0 0 40px rgba(0,255,255,0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: box-shadow 0.4s, border-color 0.4s;
    margin-bottom: 30px;
  }

  .glass:hover {
    border-color: rgba(0,255,255,0.8);
    box-shadow: 0 0 90px rgba(0,255,255,0.4);
  }

  .amount {
    font-size: 60px;
    font-weight: bold;
    color: #00ffff;
    text-shadow: 0 0 20px rgba(0,255,255,0.8);
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.5s, transform 0.5s;
  }

  .amount.show {
    opacity: 1;
    transform: scale(1);
  }

  .manifestation {
    font-size: 18px;
    color: #9fa8b0;
    letter-spacing: 1px;
    max-width: 300px;
  }
</style>
</head>
<body>

  <div class="glass" onclick="manifest()">
    <div class="amount" id="amount">$8</div>
  </div>

  <p class="manifestation">i need my 8$</p>

<script>
  let manifested = false;

  function manifest() {
    const amount = document.getElementById('amount');
    const glass = document.querySelector('.glass');

    if (!manifested) {
      amount.classList.add('show');
      glass.style.borderColor = '#00ffff';
      glass.style.boxShadow = '0 0 100px rgba(0,255,255,0.6)';
      manifested = true;
    } else {
      // little bounce every extra tap
      amount.style.transform = 'scale(1.2)';
      setTimeout(() => amount.style.transform = 'scale(1)', 150);
    }
  }
</script>

</body>
</html>
